# Blueprint de déploiement pour Render (https://render.com) — hébergement
# gratuit permettant de tester Happy Life depuis un téléphone n'importe
# où, sans que l'ordinateur ne reste allumé.
#
# Sur l'offre gratuite, le service s'endort après 15 minutes sans visite et
# se réveille en ~1 minute à la prochaine ouverture. Le système de fichiers
# étant éphémère sur cette offre, la base de données de démonstration est
# régénérée (npm run seed) à chaque build : les comptes/fiches de démo
# reviennent à leur état initial à chaque redémarrage, mais tout reste
# fonctionnel entre deux redémarrages.
#
# Voir DEPLOIEMENT-CLOUD.md pour le guide pas à pas (création du compte
# Render, connexion du dépôt, etc.).
services:
  - type: web
    name: happy-life
    runtime: node
    plan: free
    buildCommand: npm install && npm run cloud-build
    startCommand: npm run start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 22.11.0
      - key: NODE_ENV
        value: production
      - key: AUTH_SECRET
        generateValue: true
